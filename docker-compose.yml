services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-dev
      args:
        - APP_NAME=@healthguard/web
    container_name: healthguard_frontend_web
    tty: true
    stdin_open: true
    working_dir: /app/apps/web
    command: pnpm dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - .:/app
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/node_modules
    networks:
      - healthguard_network

  mobile:
    build:
      context: .
      dockerfile: Dockerfile
      target: mobile-runner
      args:
        - APP_NAME=@healthguard/mobile
    container_name: healthguard_frontend_mobile
    working_dir: /app/apps/mobile
    tty: true
    stdin_open: true
    # npx expo start --host lan asegura que el QR sea escaneable por tu celular en la misma red.
    command: npx expo start --port 8081 --host lan
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Se usa la variable de entorno HOST_IP detectada por el script de arranque
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-localhost}
      - EXPO_PUBLIC_API_URL=http://${HOST_IP:-localhost}:8000
    volumes:
      - .:/app
      - /app/apps/mobile/node_modules
      - /app/node_modules

    networks:
      - healthguard_network

networks:
  healthguard_network:
    external: false
