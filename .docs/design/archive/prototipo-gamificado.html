<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helu · Prototipo gamificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --b5:#3B82F6;--b6:#2563EB;--b7:#1D4ED8;--b8:#1E40AF;--b50:#EFF6FF;--b100:#DBEAFE;--b-tx:#2563EB;
  --or:#F97316;--or50:#FFF7ED;--or200:#FED7AA;--or-tx:#EA580C;
  --am:#F59E0B;--am50:#FFFBEB;--am200:#FDE68A;--am-tx:#B45309;
  --gr:#22C55E;--gr50:#F0FDF4;--gr200:#BBF7D0;--gr-tx:#16A34A;
  --pk:#DB2777;--pk50:#FDF2F8;--pk-tx:#DB2777;
  --em:#10B981;--em50:#ECFDF5;--em-tx:#059669;
  --vi:#8B5CF6;--vi50:#F5F3FF;--vi-tx:#7C3AED;
  --bg:#F8FAFC;--card:#FFFFFF;--line:#E5E7EB;--muted-bg:#F1F5F9;--track:#CBD5E1;
  --text:#0F172A;--text2:#6B7280;--text3:#9CA3AF;
  --lock:#E5E7EB;--lockb:#CBD5E1;--lockic:#9CA3AF;--ring:#DBEAFE;
  --stage:#E7EDF6;--stage-tx:#334155;--sidebar:#0F1E46;
}
[data-theme=dark]{
  --b50:#172554;--b100:#1E3A8A;--b-tx:#60A5FA;
  --or50:#431407;--or200:#7C2D12;--or-tx:#FB923C;
  --am50:#422006;--am200:#713F12;--am-tx:#FBBF24;
  --gr50:#052E16;--gr200:#14532D;--gr-tx:#4ADE80;
  --pk50:#500724;--pk-tx:#F472B6;--em50:#022C22;--em-tx:#34D399;--vi50:#2E1065;--vi-tx:#A78BFA;
  --bg:#0C1222;--card:#1E293B;--line:#334155;--muted-bg:#0F172A;--track:#475569;
  --text:#F8FAFC;--text2:#94A3B8;--text3:#64748B;
  --lock:#334155;--lockb:#1E293B;--lockic:#64748B;--ring:#1E3A8A;
  --stage:#060A14;--stage-tx:#CBD5E1;--sidebar:#081130;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--stage);color:var(--text);transition:background .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--b5);outline-offset:2px}
.ic{flex:none;display:block}

/* ---------- barra del prototipo ---------- */
.proto-bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:center;padding:14px 16px 6px}
.proto-brand{font:900 20px Nunito;color:var(--b-tx);display:flex;align-items:baseline;gap:8px;margin-right:4px}
.proto-brand small{font:600 12px Inter;color:var(--stage-tx);opacity:.8}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:9px;font:800 13px Nunito;color:var(--text2)}
.seg button.on{background:var(--b6);color:#fff}
.proto-reset{font:800 13px Nunito;color:var(--text2);padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.proto-tip{text-align:center;font-size:12.5px;color:var(--stage-tx);opacity:.85;padding:2px 16px 12px}
.stage{display:flex;justify-content:center;padding:0 16px 28px}
.fit{position:relative;flex:none}

/* ---------- dispositivo ---------- */
.device{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--text)}
.device.mobile{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 10px #0B1020,0 30px 60px -20px rgba(15,23,42,.5)}
.device.web{width:1280px;height:820px;border-radius:14px;box-shadow:0 0 0 1px var(--line),0 30px 60px -24px rgba(15,23,42,.45)}
.chrome{display:none;height:36px;background:var(--muted-bg);border-bottom:1px solid var(--line);align-items:center;gap:7px;padding:0 14px}
.web .chrome{display:flex}
.chrome i{width:11px;height:11px;border-radius:50%;background:#F87171}
.chrome i:nth-child(2){background:#FBBF24}.chrome i:nth-child(3){background:#34D399}
.chrome .url{margin-left:16px;flex:0 1 420px;background:var(--card);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text2)}
.app{display:flex;height:100%}
.web .app{display:grid;grid-template-columns:236px 1fr;height:calc(100% - 36px)}
.main{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;position:relative}
.statusbar{height:48px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 36px;font:700 15px Inter}
.web .statusbar{display:none}
.mobile .web-only{display:none!important}
.web .mobile-only{display:none!important}

/* sidebar web */
.sidebar{display:none}
.web .sidebar{display:flex;flex-direction:column;background:var(--sidebar);color:#CBD5E1;padding:22px 14px 18px;gap:4px}
.sb-logo{display:flex;align-items:center;gap:10px;font:900 26px Nunito;color:#fff;padding:0 8px 18px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(160deg,#60A5FA,#1D4ED8);display:grid;place-items:center;box-shadow:0 3px 0 #1E3A8A;flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font:800 14.5px Nunito;color:#C7D2FE;width:100%;transition:background .15s}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:#1D3A8A;color:#fff;box-shadow:0 3px 0 #0A1433}
.nav.muted{color:#94A3B8}
.sb-streak{margin-top:auto;margin-bottom:8px;display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(249,115,22,.14);border:2px solid rgba(249,115,22,.35)}
.sb-streak b{display:block;font:900 17px Nunito;color:#FDBA74}
.sb-streak span{font-size:12px;color:#FED7AA}

/* topbar */
.topbar{display:flex;align-items:center;gap:10px;padding:4px 18px 10px;flex:none}
.web .topbar{padding:16px 32px;background:var(--card);border-bottom:2px solid var(--line)}
.tb-logo{font:900 25px Nunito;color:var(--b-tx);display:flex;align-items:center;gap:7px}
.tb-logo .logo-mark{width:28px;height:28px;border-radius:9px}
.web .tb-logo{display:none}
.tb-title{display:none}
.web .tb-title{display:block}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);color:var(--text2);position:relative}
.icbtn .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:#EF4444;border:2px solid var(--card)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--b6);color:#fff;display:grid;place-items:center;font:900 14px Nunito;flex:none}
.avatar.lg{width:52px;height:52px;font-size:18px}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 112px;scrollbar-width:thin}
.web .scroll{padding:26px 32px 40px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 4px 0;z-index:6}
.tabbar::after{content:'';position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:9px;background:var(--text);opacity:.85}
.web .tabbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font:800 11px Nunito;color:var(--text3);width:72px}
.tab .tw{width:46px;height:32px;border-radius:12px;display:grid;place-items:center;border:2px solid transparent}
.tab.on{color:var(--b-tx)}
.tab.on .tw{background:var(--b50);border-color:var(--b100);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.fab{position:absolute;right:18px;bottom:104px;width:58px;height:58px;border-radius:20px;background:var(--b6);box-shadow:0 5px 0 var(--b8);display:none;place-items:center;color:#fff;z-index:5}
.fab:active{transform:translateY(5px);box-shadow:none}

/* ---------- piezas ---------- */
.screen{animation:enter .35s ease-out}
.screen.soft{animation:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.h1{font:900 23px/1.15 Nunito}
.h2{font:900 19px/1.2 Nunito}
.h3{font:900 16px/1.25 Nunito}
.sub{font-size:13.5px;line-height:1.45;color:var(--text2)}
.eyebrow{font:900 11.5px Nunito;letter-spacing:.08em;color:var(--b-tx)}
.eyebrow.am{color:var(--am-tx)}
.t{font:600 15px/1.3 Inter;display:block}
.s{font-size:12.5px;line-height:1.35;color:var(--text2);display:block}
.lbl{font:800 13px Nunito;color:var(--text2);margin-top:14px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-h{margin:6px 0 14px}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font:800 13px Nunito;border:2px solid transparent;white-space:nowrap;flex:none}
.chip.sm{padding:3px 8px;font-size:11.5px}
.chip-or{background:var(--or50);color:var(--or-tx);border-color:var(--or200)}
.chip-am{background:var(--am50);color:var(--am-tx);border-color:var(--am200)}
.chip-gr{background:var(--gr50);color:var(--gr-tx);border-color:var(--gr200)}
.chip-b{background:var(--b50);color:var(--b-tx);border-color:var(--b100)}
.chip-pk{background:var(--pk50);color:var(--pk-tx)}
.chip-vi{background:var(--vi50);color:var(--vi-tx)}
.chip-em{background:var(--em50);color:var(--em-tx)}
.chip-gray{background:var(--muted-bg);color:var(--text2)}
.chip.bump{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.tile{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.tile.sm{width:34px;height:34px;border-radius:11px}
.tile.am{background:var(--am50);color:var(--am-tx)}.tile.em{background:var(--em50);color:var(--em-tx)}
.tile.b{background:var(--b50);color:var(--b-tx)}.tile.pk{background:var(--pk50);color:var(--pk-tx)}
.tile.gr{background:var(--gr50);color:var(--gr-tx)}.tile.vi{background:var(--vi50);color:var(--vi-tx)}
.tile.or{background:var(--or50);color:var(--or-tx)}.tile.gray{background:var(--muted-bg);color:var(--text2)}

.btn{--c:var(--b6);--e:var(--b8);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;font:900 15px Nunito;letter-spacing:.05em;padding:13px 18px;border-radius:16px;box-shadow:0 4px 0 var(--e);transition:transform .08s,box-shadow .08s,filter .15s;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--e)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.block{width:100%}
.btn.green{--c:#16A34A;--e:#166534}
.btn.orange{--c:#EA580C;--e:#9A3412}
.btn.ghost{--c:var(--card);--e:var(--line);color:var(--b-tx);border:2px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 var(--e)}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:14px;width:100%}

.bar{height:14px;border-radius:99px;background:var(--muted-bg);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--b5),var(--b6));transition:width 1s cubic-bezier(.3,1.25,.5,1);position:relative}
.bar i::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.bar.am i{background:linear-gradient(90deg,#FBBF24,#F59E0B)}
.bar.gr i{background:linear-gradient(90deg,#4ADE80,#22C55E)}
.bar.white{background:rgba(255,255,255,.25)}.bar.white i{background:#fff}

/* mascota */
.mascot{display:block;flex:none;overflow:visible}
.mascot .mb{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 130px}
.mascot .eyes{animation:blink 4.2s infinite;transform-origin:60px 46px}
.m-wave .arm-r{animation:wave 1.1s ease-in-out infinite;transform-origin:90px 78px}
.m-point .arm-r{animation:point 1.4s ease-in-out infinite;transform-origin:90px 78px}
.m-joy .mb{animation:jump .8s cubic-bezier(.3,.8,.4,1) infinite}
.m-joy .shadow{animation:shadow .8s cubic-bezier(.3,.8,.4,1) infinite;transform-origin:60px 134px}
.m-joy .arm-l{animation:cheerL .4s ease-in-out infinite alternate;transform-origin:30px 76px}
.m-joy .arm-r{animation:cheerR .4s ease-in-out infinite alternate;transform-origin:90px 76px}

/* inicio */
.hello{display:flex;align-items:flex-end;gap:8px;margin:4px 0 16px}
.speech{position:relative;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:18px;padding:10px 14px;margin-bottom:22px;flex:1}
.speech::before{content:'';position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.grid-home{display:grid;gap:14px}
.web .grid-home{grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
.streak{background:linear-gradient(180deg,var(--or50),var(--card) 75%);border-color:var(--or200);box-shadow:0 4px 0 var(--or200)}
.streak-top{display:flex;align-items:center;gap:12px}
.big{font:900 30px/1 Nunito;color:var(--or-tx)}
.num{display:inline-block}
.num.bump{animation:bump .6s cubic-bezier(.3,1.5,.5,1)}
.flame-wrap{width:64px;height:64px;border-radius:20px;background:var(--card);display:grid;place-items:center;border:2px solid var(--or200);position:relative;flex:none}
.flame{animation:flicker 1.6s ease-in-out infinite;transform-origin:50% 85%;overflow:visible}
.flame-wrap.burst .flame{animation:burst .9s cubic-bezier(.3,1.5,.5,1)}
.week{display:flex;justify-content:space-between;margin:16px 2px 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font:800 12px Nunito;color:var(--text3)}
.wd-dot{width:34px;height:34px;border-radius:50%;background:var(--muted-bg);border:2px solid var(--line);display:grid;place-items:center}
.wd.done{color:var(--or-tx)}
.wd.done .wd-dot{background:var(--or);border-color:#EA580C;box-shadow:0 3px 0 #C2410C}
.wd.today{color:var(--or-tx)}
.wd.today:not(.done) .wd-dot{border:3px dashed var(--or);background:var(--card);animation:pulseOr 1.6s ease-in-out infinite}
.wd.fill .wd-dot{animation:dotfill .6s cubic-bezier(.34,1.56,.64,1)}
.ok-note{display:flex;gap:8px;align-items:center;font:800 14px Nunito;color:var(--gr-tx);background:var(--gr50);border-radius:14px;padding:12px;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.fine{font-size:12px;color:var(--text3);margin-top:10px;text-align:center}
.mini{display:flex;align-items:center;margin:14px 0 2px}
.md{width:18px;height:18px;border-radius:50%;background:var(--lock);flex:none;box-shadow:0 2px 0 var(--lockb)}
.md.done{background:#22C55E;box-shadow:0 2px 0 #15803D}
.md.cur{background:var(--b5);box-shadow:0 0 0 4px var(--ring);animation:pulse 1.6s infinite}
.md.goal{background:var(--am200)}
.ml{flex:1;height:4px;background:var(--lock);margin:0 2px;border-radius:2px}
.ml.done{background:#22C55E}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:2px solid var(--muted-bg);width:100%}
.item:first-of-type{border-top:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.lvl-top{display:flex;align-items:center;gap:12px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:800 11.5px/1.2 Nunito;color:var(--text2)}
.medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 var(--e),inset 0 0 0 4px rgba(255,255,255,.3);flex:none}
.medal.or{background:#F97316;--e:#C2410C}.medal.b{background:#3B82F6;--e:#1D4ED8}.medal.am{background:#F59E0B;--e:#B45309}
.badge.locked .medal{background:var(--lock);--e:var(--lockb);color:var(--lockic)}
.badge.locked{color:var(--text3)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;font:800 12px Nunito;color:var(--text2);text-align:center}
.q:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.section-title{font:900 16px Nunito;margin:22px 0 10px}

/* árbol */
.arbol-grid{display:flex;flex-direction:column;gap:14px}
.web .arbol-grid{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}
.side-col{display:flex;flex-direction:column;gap:14px}
.mobile .side-col{order:-1}
.tree-card{padding:0;overflow:hidden;background-color:var(--card);background-image:radial-gradient(var(--muted-bg) 1.6px,transparent 1.6px);background-size:22px 22px}
.tree{position:relative;width:100%}
.tree-svg{position:absolute;left:0;top:0;overflow:visible}
.seg-base{fill:none;stroke:var(--lock);stroke-width:10;stroke-linecap:round;stroke-dasharray:1 20}
.seg-done{fill:none;stroke:#22C55E;stroke-width:10;stroke-linecap:round}
.node{position:absolute;width:76px;height:76px;transform:translate(-50%,-50%);border-radius:50%;z-index:2;--c:var(--lock);--e:var(--lockb)}
.node .face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 7px 0 var(--e);transition:transform .1s,box-shadow .1s,background .3s}
.node:active .face{transform:translateY(5px);box-shadow:0 2px 0 var(--e)}
.node .face::after{content:'';position:absolute;top:11px;left:15px;width:22px;height:11px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-28deg)}
.node.done{--c:#22C55E;--e:#15803D}
.node.current{--c:#3B82F6;--e:#1D4ED8}
.node.current .face{box-shadow:0 7px 0 var(--e),0 0 0 9px var(--ring)}
.node.locked .face::after{display:none}
.node.goal{width:88px;height:88px}
.node.goal.current,.node.goal.done{--c:#F59E0B;--e:#B45309}
.node.goal.current .face{box-shadow:0 7px 0 var(--e),0 0 0 9px var(--am200)}
.node.current::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:5px solid var(--b5);animation:ring 1.8s ease-out infinite}
.node.goal.current::before{border-color:#F59E0B}
.node.pre{--c:var(--lock);--e:var(--lockb)}
.node.pre::before{display:none}
.node.pre .face{box-shadow:0 7px 0 var(--e)}
.node.pre .face svg{opacity:.35}
.node.unlock .face{animation:unlock .8s cubic-bezier(.34,1.56,.64,1)}
.node.just .face{animation:donepop .6s cubic-bezier(.34,1.56,.64,1)}
.node.shake .face{animation:shake .45s}
.node-label{position:absolute;transform:translateX(-50%);font:800 12.5px Nunito;color:var(--text2);white-space:nowrap;z-index:1;background:var(--card);padding:1px 6px;border-radius:8px}
.node-label.locked{color:var(--text3)}
.node-label.done{color:var(--gr-tx)}
.start-bubble{position:absolute;transform:translateX(-50%);z-index:3;background:var(--card);color:var(--b-tx);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:5px 12px;border-radius:12px;font:900 13px Nunito;letter-spacing:.06em;white-space:nowrap;animation:float 1.4s ease-in-out infinite;pointer-events:none}
.start-bubble::before{content:'';position:absolute;top:-8px;left:50%;width:12px;height:12px;margin-left:-6px;background:var(--card);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}
.start-bubble.late{animation:bubblein .5s cubic-bezier(.34,1.56,.64,1) 1.15s backwards,float 1.4s ease-in-out 1.65s infinite}
.tree-mascot{position:absolute;z-index:2;pointer-events:none}
.tree-mascot.late{animation:pop .5s cubic-bezier(.34,1.56,.64,1) 1.1s backwards}
.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:3px;background:var(--sc);transform:translate(-50%,-50%);animation:fly .8s ease-out forwards;pointer-events:none;z-index:4}
.steps-list .item{padding:9px 0}
.sdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--lock);color:var(--lockic)}
.sdot.done{background:#22C55E;color:#fff}.sdot.cur{background:var(--b5);color:#fff;box-shadow:0 0 0 4px var(--ring)}

/* hoja / modal */
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 30px;z-index:31;transform:translateY(105%);transition:transform .42s cubic-bezier(.3,1.2,.5,1)}
.sheet.on{transform:translateY(0)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.web .sheet{left:50%;top:50%;right:auto;bottom:auto;width:580px;max-height:86%;border-radius:26px;padding:24px 28px 28px;transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .25s;border:2px solid var(--line);box-shadow:0 6px 0 var(--line)}
.web .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.web .grab{display:none}
.sh-head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.sh-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 5px 0 var(--e);flex:none;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.st-cur{--c:#3B82F6;--e:#1D4ED8}.st-done{--c:#22C55E;--e:#15803D}.st-goal{--c:#F59E0B;--e:#B45309}.st-em{--c:#10B981;--e:#047857}
.x{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text2);background:var(--muted-bg);flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0 0;font:800 12.5px Nunito;color:var(--text2)}
.field input{padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:600 15px Inter;color-scheme:light dark}
.field input:focus{border-color:var(--b5);outline:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.pick{padding:9px 13px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font:800 14px Nunito;color:var(--text2);background:var(--card);display:inline-flex;gap:6px;align-items:center}
.pick.on{border-color:var(--b5);background:var(--b50);color:var(--b-tx);box-shadow:0 3px 0 var(--b5);animation:pop .3s ease-out}
.toggle-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--muted-bg);margin:0 0 14px;width:100%}
.switch{width:50px;height:30px;border-radius:99px;background:var(--track);position:relative;transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 3px rgba(0,0,0,.2)}
.switch.on{background:#22C55E}.switch.on::after{transform:translateX(20px)}
.drop{border:3px dashed var(--b100);border-radius:20px;padding:20px;text-align:center;background:var(--b50);color:var(--b-tx);margin:14px 0 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font:800 14px Nunito}
.up-row{display:flex;align-items:center;gap:8px;font:700 13.5px Inter;color:var(--b-tx);margin-top:12px}
.prov{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:2px solid var(--line);margin:14px 0 0}
.hint{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 12px;border-radius:16px;background:var(--b50);color:var(--b-tx);font:600 13px/1.4 Inter}
.ok-box{display:flex;gap:10px;align-items:center;padding:14px;border-radius:16px;background:var(--gr50);color:var(--gr-tx);font:800 14.5px Nunito;margin:14px 0}
.ok-box.am{background:var(--am50);color:var(--am-tx)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 4px}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:16px;border:2px solid transparent;font:800 11.5px Nunito;color:var(--text2);text-align:center}
.mood svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mood.on{border-color:var(--b5);background:var(--b50);color:var(--b-tx)}
.mood.on svg{transform:scale(1.15) rotate(-6deg)}

/* toast */
.toast{position:absolute;left:50%;top:54px;transform:translate(-50%,calc(-100% - 80px));z-index:60;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line),0 14px 30px -10px rgba(15,23,42,.4);border-radius:18px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px;font:800 14px/1.3 Nunito;width:max-content;max-width:340px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.toast.on{transform:translate(-50%,0)}
.web .toast{top:56px}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* agenda */
.segtabs{display:flex;gap:4px;background:var(--muted-bg);padding:4px;border-radius:16px;margin-bottom:14px}
.segtabs button{flex:1;padding:9px 4px;border-radius:12px;font:800 13px Nunito;color:var(--text2);white-space:nowrap;text-align:center}
.segtabs button.on{background:var(--card);color:var(--b-tx);box-shadow:0 2px 0 var(--line)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font:800 11.5px Nunito;color:var(--text2)}
.day b{font:900 18px Nunito;color:var(--text)}
.day.on{background:var(--b6);border-color:var(--b7);box-shadow:0 3px 0 var(--b8);color:#DBEAFE;animation:pop .3s ease-out}
.day.on b{color:#fff}
.day.today:not(.on){border-color:var(--b5)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.ev{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);margin-bottom:10px;border-left:6px solid var(--k);animation:enter .35s ease-out backwards}
.ev .time{font:900 12.5px/1.2 Nunito;color:var(--text2);width:58px;flex:none}
.agenda-grid{display:flex;flex-direction:column;gap:14px}
.web .agenda-grid{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.goal-ring{display:flex;align-items:center;gap:14px}
.ring-wrap{position:relative;width:84px;height:84px;flex:none}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font:900 17px Nunito}
.ring-p{transition:stroke-dashoffset 1.1s cubic-bezier(.3,1.2,.5,1)}
.moodbars{display:flex;align-items:flex-end;gap:8px;height:90px;margin:14px 0 6px}
.moodbars div{flex:1;border-radius:10px 10px 4px 4px;animation:grow .8s cubic-bezier(.3,1.3,.5,1) backwards;transform-origin:bottom}
.moodlbl{display:flex;gap:8px}.moodlbl span{flex:1;text-align:center;font:800 11px Nunito;color:var(--text3)}

/* documentos */
.ai-card{background:linear-gradient(135deg,#2563EB,#1E40AF);color:#fff;border-radius:24px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 #1E3A8A;position:relative;overflow:hidden}
.ai-card::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.ai-card .btn{--c:#fff;--e:#BFDBFE;color:#1D4ED8;margin-top:10px}
.ai-masc{background:rgba(255,255,255,.16);border-radius:20px;padding:6px 8px;flex:none}
.scanbox{position:relative;width:64px;height:80px;border-radius:10px;background:#fff;overflow:hidden;flex:none;padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.scanbox i{display:block;height:5px;border-radius:3px;background:#CBD5E1}
.scanline{position:absolute;left:0;right:0;height:3px;background:#60A5FA;box-shadow:0 0 12px 2px #60A5FA;animation:scan 1.1s ease-in-out infinite alternate}
.filters{display:flex;gap:8px;overflow-x:auto;margin:16px 0 12px;padding-bottom:4px;scrollbar-width:none}
.filters .pick{padding:7px 12px;font-size:13px;white-space:nowrap}
.doc-list{display:flex;flex-direction:column;gap:10px}
.web .doc-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.doc{display:flex;gap:12px;align-items:center;padding:12px}
.doc.new{animation:slidein .7s cubic-bezier(.34,1.56,.64,1);border-color:var(--b5);box-shadow:0 4px 0 var(--b5)}
.bp-grid{display:flex;flex-direction:column;gap:12px}
.web .bp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* celebración */
.celebrating .topbar,.celebrating .tabbar{display:none}
.celebrating .scroll{background:radial-gradient(circle at 50% 18%,var(--am50),var(--bg) 62%)}
.celebrate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:16px 4px 30px;position:relative}
.web .celebrate{max-width:620px;margin:0 auto}
.celebrate>*{position:relative;z-index:1}
.celebrate>.rays{position:absolute;top:-80px;left:50%;width:460px;height:460px;margin-left:-230px;border-radius:50%;background:repeating-conic-gradient(rgba(245,158,11,.2) 0 10deg,transparent 10deg 30deg);animation:spin 20s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);z-index:0}
.c-eyebrow{font:900 12px Nunito;letter-spacing:.12em;color:var(--am-tx);animation:pop .5s .15s backwards}
.c-title{font:900 30px/1.1 Nunito;animation:pop .6s cubic-bezier(.34,1.56,.64,1) .2s backwards}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:4px}
.stat{padding:12px 6px;border-radius:18px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--text2);animation:pop .5s cubic-bezier(.34,1.56,.64,1) var(--d) backwards}
.stat b{font:900 19px Nunito;color:var(--text)}
.new-badge{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--am50);border:2px solid var(--am200);box-shadow:0 4px 0 var(--am200);width:100%;text-align:left;animation:pop .6s cubic-bezier(.34,1.56,.64,1) .85s backwards}
.new-badge .medal{animation:flip 1.1s 1s backwards}

/* animaciones */
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(.88);opacity:.7}100%{transform:scale(1.3);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--ring)}50%{box-shadow:0 0 0 7px var(--ring)}}
@keyframes pulseOr{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.05,.95) rotate(-3deg)}50%{transform:scale(.97,1.06) rotate(2deg)}75%{transform:scale(1.03,.98) rotate(-1deg)}}
@keyframes burst{0%{transform:scale(1)}30%{transform:scale(1.75) rotate(-8deg);filter:drop-shadow(0 0 14px #FB923C)}60%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:none}35%{transform:translateY(-12px) scale(1.45)}100%{transform:none}}
@keyframes dotfill{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes bubblein{from{transform:translate(-50%,12px) scale(.4);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes unlock{0%{transform:scale(.5) rotate(-15deg)}60%{transform:scale(1.18) rotate(5deg)}100%{transform:none}}
@keyframes donepop{0%{transform:none}40%{transform:scale(1.25)}100%{transform:none}}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(200deg) scale(.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flip{0%{transform:rotateY(90deg) scale(.5)}60%{transform:rotateY(-25deg) scale(1.15)}100%{transform:none}}
@keyframes scan{from{top:6px}to{top:72px}}
@keyframes slidein{from{transform:translateY(-18px) scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
@keyframes point{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.05,.95)}15%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(.98,1.03)}85%{transform:translateY(0)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.14}50%{transform:scale(.65);opacity:.06}}
@keyframes cheerL{to{transform:rotate(12deg)}}
@keyframes cheerR{to{transform:rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

function sparks(el,n=12){

function drawTree(anim={},soft=false){

  for(let i=0;i<7;i++){const a=P[i],b=P[i+1],c=gap*.55,d=`M${a.x} ${a.y}C${a.x} ${a.y+c} ${b.x} ${b.y-c} ${b.x} ${b.y}`;

    else h+=`<div class="node-label ${st}" style="left:${p.x}px;top:${ly}px">${s.t}</div>`;
  });
  if(S.done<8){
    const i=S.done,p=P[i],left=OFF[i]>=0,mw=web?78:62,r=i===7?44:38,mh=Math.round(mw*140/120);

  }
  el.innerHTML=h;
  if(anim.seg!=null){const path=el.querySelector(`[data-seg="${anim.seg}"]`);if(path&&!RM){const L=path.getTotalLength();path.style.strokeDasharray=L;path.style.strokeDashoffset=L;path.getBoundingClientRect();path.style.transition='stroke-dashoffset .7s ease-in-out .35s';path.style.strokeDashoffset=0}}

  if(anim.unlock!=null){const n=$('#node'+anim.unlock);if(n){n.classList.add('pre');setTimeout(()=>{n.classList.remove('pre');n.classList.add('unlock');sparks(n,8)},anim.just!=null?1050:200)}}

/* ---------- motor ---------- */
function setProg(el,v){if(el.tagName.toLowerCase()==='circle')el.style.strokeDashoffset=213.6*(1-v/100);else el.style.width=v+'%'}
function render(anim=null,soft=false){
  const sc=$('#scroll'),prev={},top=sc.scrollTop;
  sc.querySelectorAll('[data-k]').forEach(e=>prev[e.dataset.k]=+e.dataset.w);
  sc.innerHTML=`<section class="screen${soft?' soft':''}">${SCREENS[S.screen]()}</section>`;
  sc.scrollTop=soft?top:0;
  const els=[...sc.querySelectorAll('[data-k]')];
  els.forEach(e=>{const k=e.dataset.k;e.style.transition='none';setProg(e,soft&&k in prev?prev[k]:0)});
  sc.offsetHeight;
  els.forEach(e=>e.style.transition='');
  requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(e=>setProg(e,+e.dataset.w))));
  if(S.screen==='arbol') drawTree(anim||{},soft);
  S.docs.forEach(d=>d.isNew=false);
  updateChrome();
}

function updateChrome(bump){
  const d=$('#device');d.classList.toggle('celebrating',S.screen==='celebracion');
  const tk={arbol:'inicio',celebracion:'inicio'}[S.screen]||S.screen;
  $$('#tabbar .tab').forEach(t=>t.classList.toggle('on',t.dataset.k===tk));

  const t=$('#toast');t.innerHTML=`<span class="tile sm ${c}">${ic==='flame'?FLAME(22):ic==='star'?STAR(20):I(ic,18,'currentColor',2.6)}</span><span>${msg}</span>`;
  t.classList.remove('on');void t.offsetWidth;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800);

function confetti(){
  if(RM) return; const cv=$('#confetti'),dv=$('#device');cv.width=dv.offsetWidth;cv.height=dv.offsetHeight;const x=cv.getContext('2d');
  const C=['#3B82F6','#22C55E','#F97316','#F59E0B','#DB2777','#8B5CF6','#10B981'];
  const P=Array.from({length:170},(_,i)=>({x:cv.width/2+(Math.random()-.5)*120,y:cv.height*.28,vx:(Math.random()-.5)*(S.platform==='web'?22:14),vy:-Math.random()*15-5,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:9+Math.random()*8,c:C[i%7]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,cv.width,cv.height);let alive=false;
    for(const p of P){p.vy+=.34;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<cv.height+30)alive=true;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()}
    if(alive&&t-t0<5500)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})(t0);
}
function addXP(n=1){
  S.lvlSteps+=n;
  if(S.lvlSteps>=30){S.lvl++;S.lvlSteps-=30;updateChrome();bumpEl($('#tbLvl'));setTimeout(()=>{toast(`¡Subiste al Nivel ${S.lvl} · ${LV[S.lvl]}!`,'star','am');confetti()},200)}
  if(S.screen==='inicio') render(null,true);
}

  if(i===0) S.docs.unshift({n:'Orden médica · '+S.proc,ty:'Orden',d:'Hoy',isNew:true});
  if(i===2) S.docs.unshift({n:'Autorización · '+S.proc,ty:'Autorización',d:'Hoy',isNew:true});
  if(i===6) S.docs.unshift({n:'Resultado · '+S.proc,ty:'Resultado',d:'Hoy',isNew:true});
  S.screen='arbol';render({seg:i,just:i,unlock:i+1});
  setTimeout(()=>toast(i===6?'¡Último paso desbloqueado!':`¡Paso completado! Sigue: ${STEPS[i+1].t}`,'check','gr'),750);
  setTimeout(()=>addXP(1),1900);
}
function upload(i){
  const box=$('#upl');if(!box||box.dataset.busy)return;box.dataset.busy=1;
  $$('#sheet .btn').forEach(b=>b.disabled=true);
  const ok={0:'Orden médica detectada',2:'Autorización detectada',6:'Resultado detectado'}[i];
  box.innerHTML=`<div class="up-row">${I('file',18)}<span id="upTxt">Subiendo archivo…</span></div><div class="bar"><i id="upBar" style="width:0%"></i></div>`;
  setTimeout(()=>$('#upBar').style.width='50%',40);
  setTimeout(()=>{$('#upTxt').innerHTML=`${I('sparkles',16)} La IA está leyendo el documento…`;$('#upBar').style.width='88%'},800);
  setTimeout(()=>{$('#upBar').style.width='100%';$('#upTxt').innerHTML=`<b>${ok}</b> · guardada en Documentos`},1700);
  setTimeout(()=>complete(i),2500);
}
function saveCheckin(){
  if(S.mood==null)return;closeSheet();S.checked=true;S.streak++;
  if(S.screen!=='inicio'){S.screen='inicio';render()}else render(null,true);
  const n=$('#streakNum');if(n)n.textContent=S.streak-1;
  $('#tbStreak b').textContent=S.streak-1;$('#sbStreak').textContent=`${S.streak-1} días`;
  setTimeout(()=>{const f=$('#flameWrap');if(f){f.classList.add('burst');sparks(f,10)}},250);
  setTimeout(()=>{if(n){n.textContent=S.streak;n.classList.add('bump')}updateChrome(true);$('#todayDot')?.classList.add('fill');toast(`¡${S.streak} días seguidos cuidándote!`,'flame','or')},600);
  setTimeout(()=>addXP(1),2000);
}
function aiUpload(){
  if(S.scanning)return;S.scanning=true;render(null,true);
  setTimeout(()=>{S.scanning=false;S.docs.unshift({n:'Resultado · Ecografía de rodilla',ty:'Resultado',d:'Hoy',isNew:true});S.docF='Todos';render(null,true);toast('La IA lo clasificó como Resultado','sparkles','vi');setTimeout(()=>addXP(1),1200)},2300);
}
function saveAppt(){
  const dv=$('#fDate').value||'2026-11-06',tv=$('#fTime').value||'07:30',pl=$('#fPlace').value||'Clínica Central';
  const [y,m,d]=dv.split('-').map(Number),dt=new Date(y,m-1,d);
  const W=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],MO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const [hh,mm]=tv.split(':').map(Number),time=`${hh%12||12}:${String(mm).padStart(2,'0')} ${hh>=12?'p. m.':'a. m.'}`;
  S.appt={label:`${W[dt.getDay()]} ${d} ${MO[m-1]} · ${time}`,time,place:pl,di:(y===2026&&m===11&&d>=2&&d<=8)?d-2:-1};
  complete(4);
}

const ACT={
  go:s=>{closeSheet();go(s)},
  platform:p=>{S.platform=p;applyFrame();render(null,true)},
  theme:t=>{S.theme=t;document.documentElement.dataset.theme=t;updateChrome();if(S.screen==='mas')render(null,true)},
  themeToggle:()=>ACT.theme(S.theme==='dark'?'light':'dark'),
  jump:s=>{closeSheet();
    if(s==='detalle'){if(S.done>=8)S.done=3;go('arbol');setTimeout(()=>nodeTap(S.done),500);return}
    if(s==='celebracion'){S.done=8;S.badgeFirst=true;go('celebracion');setTimeout(confetti,250);return}
    go(s)},
  reset:()=>{closeSheet();S=fresh();render();toast('Demo reiniciada','check','b')},
  node:i=>nodeTap(+i), complete:i=>complete(+i), upload:i=>upload(+i), saveAppt,
  pick1:v=>{S.pick1=+v;refreshSheet()}, rem:k=>{S.rem[k]=!S.rem[k];refreshSheet()}, care:()=>{S.care=!S.care;refreshSheet()},
  checkin:()=>{if(!S.checked)openSheet(checkinSheet)}, mood:m=>{S.mood=+m;refreshSheet()},
  sym:s=>{if(s==='Ninguno')S.sym=S.sym.includes(s)?[]:['Ninguno'];else{S.sym=S.sym.filter(x=>x!=='Ninguno');S.sym=S.sym.includes(s)?S.sym.filter(x=>x!==s):[...S.sym,s]}refreshSheet()},
  saveCheckin,
  take:()=>{if(S.medTaken)return;S.medTaken=true;S.goal=Math.min(14,S.goal+1);render(null,true);toast('Toma registrada a las 8:02 a. m.','pill','am');setTimeout(()=>addXP(1),1300)},
  snooze:()=>toast('Te lo recordamos en 15 minutos','clock','am'),
  closeSheet, agTab:t=>{S.agTab=t;render(null,true)}, day:d=>{S.day=+d;render(null,true)},
  docF:f=>{S.docF=f;render(null,true)}, ai:aiUpload,
  newProcess:()=>{closeSheet();S.proc='Control con ortopedia';S.done=0;S.appt=null;S.screen='arbol';render({unlock:0});setTimeout(()=>toast('Nuevo proceso creado. ¡Vamos con el primer paso!','route','b'),500)},
  soon:()=>toast('Esta sección se mantiene igual, con el nuevo estilo.','sparkles','b'),
  share:()=>toast('Enlace seguro y código QR listos para compartir','qr','vi'),
  call:()=>toast('Abriendo el marcador: 601 555 0102','phone','b'),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const i=el.dataset.act.indexOf(':');const a=i<0?el.dataset.act:el.dataset.act.slice(0,i),arg=i<0?undefined:el.dataset.act.slice(i+1);if(ACT[a]){e.preventDefault();ACT[a](arg,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- marco ---------- */
function applyFrame(){const d=$('#device');d.classList.toggle('mobile',S.platform==='mobile');d.classList.toggle('web',S.platform==='web');fit()}
function fit(){
  const m=S.platform==='mobile',W=m?390:1280,H=m?844:820,pad=m?10:0;
  const aw=innerWidth-32,ah=innerHeight-$('#bar').offsetHeight-$('.proto-tip').offsetHeight-36;
  const s=Math.min(1,aw/(W+pad*2),Math.max(.45,ah/(H+pad*2)));S.scale=s;
  $('#device').style.transform=`translate(${pad*s}px,${pad*s}px) scale(${s})`;
  $('#fit').style.width=(W+pad*2)*s+'px';$('#fit').style.height=(H+pad*2)*s+'px';
}
function initChrome(){
  $('#tbLogo').innerHTML=LOGO+'helu';
  $('#tbBell').innerHTML=I('bell',18)+'<span class="dot"></span>';
  $('#fab').innerHTML=I('plus',26,'#fff',3);
  $('#sbIcons').innerHTML='<svg width="66" height="12" viewBox="0 0 66 12" aria-hidden="true" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M30 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM32.8 6.5a5 5 0 0 1 6.4 0L36 10z"/><rect x="45" y="1" width="18" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="47" y="3" width="13" height="6" rx="1.5"/></svg>';
  const T=[['docs','Documentos','file'],['agenda','Agenda','calendar'],['inicio','Inicio','home'],['mochilas','Mochilas','backpack'],['mas','Más','menu']];
  $('#tabbar').innerHTML=T.map(t=>`<button class="tab" data-k="${t[0]}" data-act="go:${t[0]}"><span class="tw">${I(t[2],22)}</span>${t[1]}</button>`).join('');
  const N=[['inicio','Inicio','home'],['arbol','Procesos','route'],['agenda','Agenda','calendar'],['docs','Documentos','file'],['mochilas','Mochilas','backpack'],[null,'Compartir','share'],[null,'Dependientes','users'],['mas','Más opciones','menu']];
  $('#sidebar').innerHTML=`<div class="sb-logo">${LOGO}helu</div>${N.map(n=>`<button class="nav" ${n[0]?`data-k="${n[0]}" data-act="go:${n[0]}"`:'data-act="soon"'}>${I(n[2],20)} ${n[1]}</button>`).join('')}
   <div class="sb-streak">${FLAME(32)}<div><b id="sbStreak">12 días</b><span>Racha de check-in</span></div></div>
   <button class="nav muted" data-act="soon">${I('logout',20)} Cerrar sesión</button>`;
}
addEventListener('resize',()=>{fit();if(S.screen==='arbol')drawTree({},true)});
initChrome();applyFrame();render();
document.fonts?.ready.then(()=>{fit();if(S.screen==='arbol')drawTree({},true)});
</script>
